apiVersion: space-man/v1
kind: SpaceSetup

metadata:
  name: Demo space

resources:
  languages:
    - code: it
      name: Italian

  components:
    - name: page
      displayName: Page
      isRoot: true
      schema:
        body:
          type: bloks
    - name: feature
      displayName: Feature
      isNestable: true
      schema:
        headline:
          type: text

  datasources:
    - name: categories

  stories:
    - path: home
      name: Home

  tags:
    - name: demo
