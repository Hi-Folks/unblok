# yaml-language-server: $schema=../../space-setup.schema.json
version: 1
inputs:
  space_name:
    default: Customer Demo
space:
  name: "${{ inputs.space_name }}"
  duplicate_from: "123456" # Replace with your source space ID.
  in_org: true
  demo: false
  readiness:
    timeout_seconds: 120
    poll_interval_seconds: 2
