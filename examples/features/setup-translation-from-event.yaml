# yaml-language-server: $schema=../../space-setup.schema.json
version: 1
inputs:
  story_id:
    description: Story ID supplied by the automation
  language:
    description: Target language code, such as de or it
  workflow:
    description: Workflow containing the review stage
    default: Default
  review_stage:
    description: Existing review stage for the translated language
    default: Reviewing
workflow:
  edit:
    - workflow: "${{ inputs.workflow }}"
      per_language_stages: true
stories:
  ai_translate:
    - story_id: "${{ inputs.story_id }}"
      languages:
        - lang: "${{ inputs.language }}"
          code: "${{ inputs.language }}"
      review_stage: "${{ inputs.review_stage }}"
      workflow: "${{ inputs.workflow }}"
      overwrite: false
